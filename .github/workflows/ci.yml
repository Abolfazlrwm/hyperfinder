name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++
          - name: Linux Clang
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: macOS AppleClang
            os: macos-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows MSVC
            os: windows-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -V -C Release

  presets:
    # Builds exactly what the README tells a Linux user to run, so the
    # documented preset workflow cannot rot unnoticed.
    name: Presets (Linux GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Test
        run: ctest --preset release -V

  coverage:
    # Line-coverage summary on Linux GCC: build the unit tests with gcov
    # instrumentation, run them, and fail when the non-test line coverage
    # drops below the gate. Keeps the suite honest about what it exercises.
    name: Coverage (Linux GCC)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install gcovr
        run: pipx install gcovr

      - name: Configure
        run: >
          cmake -S . -B build-cov -G "Unix Makefiles"
          -DCMAKE_BUILD_TYPE=Debug
          -DHYPERFINDER_BUILD_TESTS=ON
          -DCMAKE_CXX_FLAGS=--coverage
          -DCMAKE_EXE_LINKER_FLAGS=--coverage

      - name: Build
        run: cmake --build build-cov --parallel

      - name: Test
        run: ctest --test-dir build-cov --output-on-failure

      - name: Coverage summary and gate
        run: >
          gcovr -r . --object-directory build-cov
          --exclude '.*tests/.*'
          --exclude '.*_deps/.*'
          --exclude '.*CMakeFiles/.*'
          --txt report.txt
          --gcov-ignore-parse-errors negative_hits.warn_once_per_file
          --fail-under-line 70

      - name: Show report
        if: always()
        run: cat report.txt

  sanitizers:
    name: Linux ${{ matrix.preset }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset:
          - asan
          - tsan

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # The sanitizer test presets already export ASAN_OPTIONS, UBSAN_OPTIONS
      # and TSAN_OPTIONS, so a finding aborts the run. Deliberately not set
      # here: the point is to exercise the preset as a user would get it.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -V
