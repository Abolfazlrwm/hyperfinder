# Builds, tests and publishes the release binaries when a v* tag is pushed.
#
# The release notes come from the matching section in CHANGELOG.md, so the
# changelog entry is the single place a release is described. Re-running the
# workflow from an existing tag refreshes the assets and the checksums without
# a new tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A manual dispatch from main would produce archives named after a branch;
    # the job only makes sense on a tag.
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            os_name: linux
          - name: macOS (Apple silicon)
            os: macos-latest
            os_name: macos
          - name: Windows x86_64
            os: windows-latest
            os_name: windows
            static_crt: true

    steps:
      - uses: actions/checkout@v7

      # MultiThreaded links the CRT statically, so the released exe runs on a
      # machine that has neither MinGW nor the VC++ redist installed. The
      # workflow only builds Release, so the plain value needs no generator
      # expression.
      - name: Configure (static CRT)
        if: matrix.static_crt
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Configure
        if: "!matrix.static_crt"
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # A broken archive must not reach the release page: the same suite CI
      # runs on every push gates the binaries too.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (tar.gz)
        if: "!matrix.static_crt"
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCH="$(uname -m | sed 's/^arm64$/aarch64/')"
          NAME="hyperfinder-${VERSION}-${ARCH}-${{ matrix.os_name }}"
          mkdir -p "dist/${NAME}"
          cp build/hyperfinder "dist/${NAME}/"
          cp README.md LICENSE "dist/${NAME}/"
          tar -czf "${NAME}.tar.gz" -C dist "${NAME}"

      - name: Package (zip)
        if: matrix.static_crt
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $stage = "dist/hyperfinder-$version-x86_64-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/Release/hyperfinder.exe $stage/
          Copy-Item README.md, LICENSE $stage/
          Compress-Archive -Path $stage -DestinationPath "hyperfinder-$version-x86_64-windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os_name }}
          path: hyperfinder-*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Download built archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: .

      - name: Checksums
        run: sha256sum hyperfinder-*.tar.gz hyperfinder-*.zip > SHA256SUMS

      - name: Release notes from the changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Keep the body of the "## [VERSION]" section, up to the next header,
          # with the leading blank lines trimmed.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { insec = 1; next }
            insec && /^## \[/ { exit }
            insec { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          cat notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="hyperfinder ${GITHUB_REF_NAME}"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --clobber hyperfinder-* SHA256SUMS
          elif [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --notes-file notes.md hyperfinder-* SHA256SUMS
          else
            # A tag without a changelog entry still gets a release, generated
            # from the commits since the last one.
            gh release create "$GITHUB_REF_NAME" --title "$TITLE" --generate-notes hyperfinder-* SHA256SUMS
          fi
